[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secsentinel"
version = "1.0.0"
description = "Dependency-free defensive security toolkit: SSH log analysis, file integrity monitoring and password auditing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "blue-team", "ssh", "file-integrity", "password-audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: System Administrators",
]

[project.scripts]
secsentinel = "secsentinel.cli:main"

[tool.setuptools]
packages = ["secsentinel"]
